[project]
name = "critter-crafter"
version = "0.1.0"
description = "Procedural skeleton-first monster asset pipeline (Meshy + Blender) with a Unity assembly package"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "Pillow>=10.4",
]

[project.scripts]
critter = "critter_crafter.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/critter_crafter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["blender: requires a Blender 5.x executable (auto-skipped when not found)"]
